<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LingoQuest - Professional Language Learning Platform</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->

    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              nunito: ["Nunito", "sans-serif"],
            },
            colors: {
              duoGreen: "#58cc02",
              duoGreenHover: "#46a302",
              duoGreenDark: "#58a700",
              duoBlue: "#1cb0f6",

              duoYellow: "#ffc800",
              duoYellowHover: "#e6b400",
              duoRed: "#ff4b4b",
              duoRedHover: "#ea2b2b",

    <style>
      body {
        font-family: "Nunito", sans-serif;
        background-color: #ffffff;
        color: #3c3c3c;
        user-select: none;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb {
        background: #d1d5db;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #9ca3af;
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        20%,
        60% {
          transform: translateX(-6px);
        }
        40%,
        80% {
          transform: translateX(6px);
        }
      }
      .animate-shake {
        animation: shake 0.4s ease-in-out;
      }
      @keyframes pop {
        0% {
          transform: scale(0.9);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      .animate-pop {
        animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
    </style>
  </head>

    <script>
      // --- VIEW RENDERING ENGINE ---
      function switchTab(tab) {
        state.currentTab = tab;

        // Update sidebar active states
        ["learn", "practice", "leaderboard", "shop", "profile"].forEach((t) => {
          const btn = document.getElementById(`nav-${t}`);
          const mobBtn = document.getElementById(`mob-nav-${t}`);
          if (btn) {
            if (t === tab) {
              btn.className =
                "w-full flex items-center space-x-4 px-4 py-3 rounded-xl font-bold text-sm tracking-wider uppercase transition-all duration-200 text-duoGreen bg-duoGreen/10 border-2 border-duoGreen";
            } else {
              btn.className =
                "w-full flex items-center space-x-4 px-4 py-3 rounded-xl font-bold text-sm tracking-wider uppercase transition-all duration-200 text-duoGray hover:bg-gray-100";
            }
          }
          if (mobBtn) {
            if (t === tab) {
              mobBtn.className = "flex flex-col items-center text-duoGreen";
            } else {
              mobBtn.className = "flex flex-col items-center text-duoGray";
            }
          }
        });

        renderView();
      }

      function renderView() {
        const container = document.getElementById("view-container");
        container.innerHTML = "";

        if (state.currentTab === "learn") {
          container.innerHTML = renderLearnView();
        } else if (state.currentTab === "practice") {
          container.innerHTML = renderPracticeView();
        } else if (state.currentTab === "leaderboard") {
          container.innerHTML = renderLeaderboardView();
        } else if (state.currentTab === "shop") {
          container.innerHTML = renderShopView();
        } else if (state.currentTab === "profile") {
          container.innerHTML = renderProfileView();
        }
      }

      // --- LEARN VIEW (Skill Tree) ---
      function renderLearnView() {
        const lang = state.selectedLanguage;
        const progress = state.lessonProgress[lang] || {};

        let html = `
                <div class="flex flex-col items-center space-y-8 py-4">
                    <!-- Unit Banner -->
                    <div class="w-full bg-duoGreen text-white rounded-3xl p-6 flex flex-col md:flex-row justify-between items-center shadow-lg">
                        <div>
                            <span class="uppercase tracking-widest font-black text-xs bg-black/25 px-3 py-1 rounded-full">Unit 1 • Foundation</span>
                            <h2 class="text-3xl font-black mt-2">Master ${lang} Basics</h2>
                            <p class="text-white/90 font-medium mt-1">Build your foundational vocabulary and grammar skills.</p>
                        </div>
                        <button onclick="startLesson(0)" class="mt-4 md:mt-0 bg-white text-duoGreen font-black px-6 py-3 rounded-2xl shadow-md hover:bg-gray-100 transition transform hover:scale-105 uppercase tracking-wider">
                            Guidebook
                        </button>
                    </div>

                    <!-- Skill Tree Path -->
                    <div class="flex flex-col items-center space-y-12 w-full py-6">
            `;

        skillTreeNodes.forEach((node, index) => {
          const status =
            progress[index] || (index === 0 ? "current" : "locked");

          let btnColor =
            "bg-duoGray border-gray-400 text-white cursor-not-allowed";
          let shadowColor = "shadow-gray-300";
          let iconBg = "bg-gray-400";
          let ringEffect = "";

          if (status === "completed") {
            btnColor =
              "bg-duoYellow border-yellow-600 text-white hover:bg-duoYellowHover cursor-pointer";
            shadowColor = "shadow-yellow-500/50";
            iconBg = "bg-yellow-600";
          } else if (status === "current") {
            btnColor =
              "bg-duoGreen border-duoGreenDark text-white hover:bg-duoGreenHover cursor-pointer";
            shadowColor = "shadow-duoGreen/50";
            iconBg = "duoGreenDark";
            ringEffect = "ring-4 ring-duoGreen/30 animate-pulse";
          }

          // Alternating offsets for Duolingo serpentine path look
          const offsets = [
            "translate-x-0",
            "translate-x-12",
            "translate-x-0",
            "-translate-x-12",
            "translate-x-0",
            "translate-x-8",
          ];
          const offsetClass = offsets[index % offsets.length];

          html += `
                    <div class="flex flex-col items-center ${offsetClass} relative group">
                        <!-- Tooltip on hover -->
                        <div class="absolute -top-12 opacity-0 group-hover:opacity-100 transition bg-duoDark text-white px-3 py-1 rounded-xl text-xs font-bold pointer-events-none whitespace-nowrap shadow-lg">
                            ${node.title}: ${node.desc}
                        </div>

    <script>
      let currentLessonData = null;
      let currentQuestionIndex = 0;
      let selectedAnswer = null;
      let matchedPairsState = { selectedLeft: null, matchedCount: 0 };

      function startLesson(skillId) {
        const node =
          skillTreeNodes.find((n) => n.id === skillId) || skillTreeNodes[0];
        const questions =
          lessonQuestions[node.title] || lessonQuestions["Basics 1"];

        currentLessonData = {
          skillId: skillId,
          title: node.title,
          questions: [...questions],
        };
        currentQuestionIndex = 0;
        state.hearts = Math.max(1, state.hearts);

        document.getElementById("lesson-modal").classList.remove("hidden");
        renderCurrentQuestion();
      }

      function startPracticeSession(mode) {
        currentLessonData = {
          skillId: 0,
          title: mode === "mistakes" ? "Mistake Review" : "Lightning Blitz",
          questions: [
            ...lessonQuestions["Basics 1"],
            ...lessonQuestions["Phrases"],
          ],
        };
        currentQuestionIndex = 0;
        document.getElementById("lesson-modal").classList.remove("hidden");
        renderCurrentQuestion();
      }

      function closeLesson() {
        document.getElementById("lesson-modal").classList.add("hidden");
        renderView();
      }

      function renderCurrentQuestion() {
        if (
          !currentLessonData ||
          currentQuestionIndex >= currentLessonData.questions.length
        ) {
          finishLesson();
          return;
        }

        const q = currentLessonData.questions[currentQuestionIndex];
        const progressPct =
          (currentQuestionIndex / currentLessonData.questions.length) * 100;
        document.getElementById("lesson-progress-bar").style.width =
          `${progressPct}%`;
        document.getElementById("lesson-hearts").innerText = state.hearts;

        const contentArea = document.getElementById("lesson-content-area");
        selectedAnswer = null;
        resetCheckButton();

        if (q.type === "multiple_choice" || q.type === "listen_choose") {
          let html = `
                    <h2 class="text-2xl md:text-3xl font-black text-duoDark">${q.prompt}</h2>
                `;
          if (q.type === "listen_choose" || q.audioText) {
            html += `
                        <div class="flex justify-center my-4">
                            <button onclick="speakAudio('${q.audioText}')" class="w-20 h-20 rounded-full bg-duoBlue text-white text-3xl flex items-center justify-center shadow-lg hover:bg-duoBlueHover transition transform hover:scale-105">
                                <i class="fa-solid fa-volume-high"></i>
                            </button>
                        </div>
                    `;
          }
          html += `
                    <div class="bg-gray-50 border-2 border-duoBorder rounded-2xl p-6 text-center my-4">
                        <span class="text-3xl font-black text-duoDark">${q.target}</span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                `;
          q.options.forEach((opt, idx) => {
            html += `
                        <button onclick="selectOption(this, '${opt}')" class="p-4 rounded-2xl border-2 border-duoBorder font-bold text-lg text-duoDark hover:bg-gray-100 transition text-center shadow-sm">
                            ${opt}
                        </button>
                    `;
          });
          html += `</div>`;
          contentArea.innerHTML = html;
        } else if (q.type === "match_pairs") {
          matchedPairsState = { selectedLeft: null, matchedCount: 0 };
          let shuffledRight = [...q.pairs].sort(() => Math.random() - 0.5);

          let html = `
                    <h2 class="text-2xl font-black text-duoDark">${q.prompt}</h2>
                    <div class="grid grid-cols-2 gap-6 my-6">
                        <div class="flex flex-col space-y-3" id="pairs-left-col">
                `;
          q.pairs.forEach((p, idx) => {
            html += `<button onclick="selectPairLeft(this, '${p.left}')" class="p-4 rounded-2xl border-2 border-duoBorder font-extrabold text-duoDark bg-white shadow-sm hover:border-duoBlue transition">${p.left}</button>`;
          });
          html += `</div><div class="flex flex-col space-y-3" id="pairs-right-col">`;
          shuffledRight.forEach((p, idx) => {
            html += `<button onclick="selectPairRight(this, '${p.right}')" class="p-4 rounded-2xl border-2 border-duoBorder font-extrabold text-duoDark bg-white shadow-sm hover:border-duoBlue transition">${p.right}</button>`;
          });
          html += `</div></div>`;
          contentArea.innerHTML = html;
        } else if (q.type === "fill_blank") {
          let html = `
                    <h2 class="text-2xl font-black text-duoDark">${q.prompt}</h2>
                    <div class="grid grid-cols-2 gap-4 mt-6">
                `;
          q.options.forEach((opt) => {
            html += `
                        <button onclick="selectOption(this, '${opt}')" class="p-4 rounded-2xl border-2 border-duoBorder font-bold text-lg text-duoDark hover:bg-gray-100 transition text-center shadow-sm">
                            ${opt}
                        </button>
                    `;
          });
          html += `</div>`;
          contentArea.innerHTML = html;
        }
      }

      function selectOption(btn, val) {
        // Clear selections
        const buttons = btn.parentNode.querySelectorAll("button");
        buttons.forEach((b) => {
          b.classList.remove("border-duoBlue", "bg-duoBlue/10", "text-duoBlue");
          b.classList.add("border-duoBorder");
        });
        // Highlight selected
        btn.classList.remove("border-duoBorder");
        btn.classList.add("border-duoBlue", "bg-duoBlue/10", "text-duoBlue");
        selectedAnswer = val;

        const checkBtn = document.getElementById("lesson-check-btn");
        checkBtn.disabled = false;
        checkBtn.className =
          "px-10 py-3 rounded-2xl font-extrabold uppercase tracking-wider bg-duoGreen hover:bg-duoGreenHover text-white cursor-pointer shadow-lg transition transform hover:scale-105";
      }

      function resetCheckButton() {
        const checkBtn = document.getElementById("lesson-check-btn");
        checkBtn.disabled = true;
        checkBtn.className =
          "px-10 py-3 rounded-2xl font-extrabold uppercase tracking-wider bg-duoBorder text-duoGray cursor-not-allowed transition shadow-md";
      }

      function checkAnswer() {
        const q = currentLessonData.questions[currentQuestionIndex];

        if (q.type === "match_pairs") {
          if (matchedPairsState.matchedCount === q.pairs.length) {
            showFeedback(true, "Great job!");
          } else {
            showFeedback(false, "Match all pairs first!");
          }
          return;
        }

        if (!selectedAnswer) return;

        const isCorrect = selectedAnswer === q.correct;
        if (isCorrect) {
          showFeedback(true, "Correct!");
        } else {
          state.hearts = Math.max(0, state.hearts - 1);
          document.getElementById("lesson-hearts").innerText = state.hearts;
          showFeedback(false, `Correct answer: ${q.correct}`);
        }
      }

      function showFeedback(isCorrect, message) {
        const toast = document.getElementById("feedback-toast");
        const iconContainer = document.getElementById(
          "feedback-icon-container",
        );
        const icon = document.getElementById("feedback-icon");
        const title = document.getElementById("feedback-title");
        const subtitle = document.getElementById("feedback-subtitle");
        const nextBtn = document.getElementById("feedback-next-btn");

        toast.classList.remove("translate-y-full");

        if (isCorrect) {
          toast.className =
            "fixed bottom-0 left-0 right-0 p-6 transform transition-transform duration-300 z-50 flex items-center justify-between px-8 md:px-32 shadow-2xl bg-duoGreen";
          iconContainer.className =
            "w-14 h-14 rounded-full bg-white flex items-center justify-center text-3xl font-black shadow-md text-duoGreen";
          icon.className = "fa-solid fa-check text-duoGreen";
          title.innerText = "Excellent!";
          subtitle.innerText = message;
          nextBtn.className =
            "ml-auto px-8 py-3 bg-white text-duoGreen font-black rounded-2xl uppercase tracking-wider shadow-lg transition transform hover:scale-105";
        } else {
          toast.className =
            "fixed bottom-0 left-0 right-0 p-6 transform transition-transform duration-300 z-50 flex items-center justify-between px-8 md:px-32 shadow-2xl bg-duoRed";
          iconContainer.className =
            "w-14 h-14 rounded-full bg-white flex items-center justify-center text-3xl font-black shadow-md text-duoRed animate-shake";
          icon.className = "fa-solid fa-xmark text-duoRed";
          title.innerText = "Incorrect";
          subtitle.innerText = message;
          nextBtn.className =
            "ml-auto px-8 py-3 bg-white text-duoRed font-black rounded-2xl uppercase tracking-wider shadow-lg transition transform hover:scale-105";
        }
      }

      function nextQuestion() {
        const toast = document.getElementById("feedback-toast");
        toast.classList.add("translate-y-full");

        currentQuestionIndex++;
        if (
          currentLessonData &&
          currentQuestionIndex < currentLessonData.questions.length
        ) {
          renderCurrentQuestion();
        } else {
          finishLesson();
        }
      }

      function finishLesson() {
        document.getElementById("lesson-modal").classList.add("hidden");

        // Reward XP & Gems
        const lang = state.selectedLanguage;
        state.languages[lang].xp += 15;
        state.gems += 20;

        // Unlock next skill node
        const skillId = currentLessonData.skillId;
        if (state.lessonProgress[lang]) {
          state.lessonProgress[lang][skillId] = "completed";
          if (state.lessonProgress[lang][skillId + 1] === "locked") {
            state.lessonProgress[lang][skillId + 1] = "current";
          }
        }

        // Show celebratory reward alert banner
        showNotification(`Lesson Completed! +15 XP and +20 Gems earned! 🎉`);
        renderView();
      }

      function skipQuestion() {
        nextQuestion();
      }

      // --- WEB SPEECH API PRONUNCIATION ---
      function speakAudio(text) {
        if ("speechSynthesis" in window) {
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang =
            state.languages[state.selectedLanguage].code || "es-ES";
          window.speechSynthesis.speak(utterance);
        } else {
          showNotification(`Pronunciation: "${text}"`);
        }
      }

      // --- SHOP & NOTIFICATIONS ---
      function buyItem(itemType, cost) {
        if (state.gems >= cost) {
          state.gems -= cost;
          if (itemType === "hearts") {
            state.hearts = state.maxHearts;
          }
          showNotification(`Successfully purchased ${itemType}!`);
          renderView();
        } else {
          showNotification(`Not enough gems! Complete more lessons.`);
        }
      }

      function showNotification(msg) {
        const notif = document.createElement("div");
        notif.className =
          "fixed top-6 left-1/2 transform -translate-x-1/2 bg-duoDark text-white font-black px-6 py-3 rounded-2xl shadow-2xl z-50 animate-pop text-sm md:text-base";
        notif.innerText = msg;
        document.body.appendChild(notif);
        setTimeout(() => notif.remove(), 3500);
      }

      // Initial render on window load
      window.onload = function () {
        renderView();
      };
    </script>
  </body>
</html>
